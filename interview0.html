<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chimera RPG Quest Club</title>
<style>
  body {
    margin: 0;
    background-color: black;
    font-family: 'Arial', sans-serif;
    color: #b0c4de;
    overflow: hidden;
  }

  .centered {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 20px;
  }

  #floating-title {
    font-size: 2em;
    margin-bottom: 10px;
    color: #7fb0f5;
    animation: float 2s infinite alternate;
    cursor: pointer; /* Make it clear it's clickable */
  }

  @keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-10px); }
  }

  #coffee-emoji {
    font-size: 5em;
    cursor: pointer; /* Visual cue for clickability */
    transition: transform 0.2s;
  }

  #coffee-emoji:hover {
    transform: scale(1.1);
  }

  #transition {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3em;
    color: #b0c4de;
    opacity: 0;
    z-index: 10;
    transition: opacity 2s, filter 2s;
  }

  .hidden {
    display: none;
  }

  /* Other styles omitted for brevity, same as previous code */
</style>
</head>
<body>

<!-- Initial Scene -->
<div id="initialScene" class="centered">
  <div id="floating-title">Enter on your own will</div>
  <div id="coffee-container">
    <div id="coffee-emoji">☕️</div>
  </div>
</div>

<!-- Transition Effect -->
<div id="transition"></div>

<!-- Rest of your content... (unchanged) -->

<!-- JavaScript -->
<script>
  // Make sure script runs after DOM is loaded
  document.addEventListener('DOMContentLoaded', () => {
    const initialScene = document.getElementById('initialScene');
    const floatingTitle = document.getElementById('floating-title');
    const coffeeEmoji = document.getElementById('coffee-emoji');
    const transitionDiv = document.getElementById('transition');

    // Attach click event to coffee emoji
    coffeeEmoji.addEventListener('click', () => {
      console.log('Coffee emoji clicked'); // Debug
      startTransition();
    });

    // Attach click event to floating title for redundancy
    floatingTitle.addEventListener('click', () => {
      console.log('Floating title clicked'); // Debug
      startTransition();
    });

    function startTransition() {
      transitionDiv.style.opacity = '1';
      transitionDiv.style.filter = 'blur(10px)';
      setTimeout(() => {
        transitionDiv.style.opacity = '0';
        transitionDiv.style.filter = 'blur(0)';
        setTimeout(() => {
          transitionDiv.style.display = 'none';
          showNamePrompt();
        }, 2000);
      }, 2000);
    }

    // Rest of your code...
    // (No changes to other parts, just ensuring the clickable elements are responding)
  });
</script>
</body>
</html>
