<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chimera RPG Quest Club</title>
<style>
  body {
    margin: 0;
    background-color: black;
    font-family: 'Arial', sans-serif;
    color: #b0c4de;
    overflow: hidden;
  }

  /* Center the coffee cup */
  .centered {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 20px;
  }

  /* Coffee cup emoji styling */
  #coffee-emoji {
    font-size: 5em;
    cursor: pointer; /* visual cue for clickability */
    transition: transform 0.2s;
  }

  #coffee-emoji:hover {
    transform: scale(1.1);
  }

  /* Transition overlay */
  #transition {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3em;
    color: #b0c4de;
    opacity: 0;
    z-index: 10;
    transition: opacity 2s, filter 2s;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>

<!-- Only the coffee cup on the initial page -->
<div id="initialScene" class="centered">
  <div id="coffee-container">
    <div id="coffee-emoji">☕️</div>
  </div>
</div>

<!-- Transition overlay -->
<div id="transition"></div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const coffeeEmoji = document.getElementById('coffee-emoji');
    const transitionDiv = document.getElementById('transition');

    // Attach click event
    coffeeEmoji.addEventListener('click', () => {
      startTransition();
    });

    function startTransition() {
      transitionDiv.style.opacity = '1';
      transitionDiv.style.filter = 'blur(10px)';
      setTimeout(() => {
        transitionDiv.style.opacity = '0';
        transitionDiv.style.filter = 'blur(0)';
        setTimeout(() => {
          transitionDiv.style.display = 'none';
          alert('Transition complete! You can now proceed to the next part of your site.');
        }, 2000);
      }, 2000);
    }
  });
</script>

</body>
</html>
