<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hans' Awakening — Chimera Cats Café</title>
  <style>
    :root {
      --bg:#000;
      --color-start: #6495ED;
      --color-end: #C0C0C0;
      --fade-time: 900ms;
      --line-delay-default: 3200ms;
      --max-width: 980px;
    }
    html,body{height:100%;margin:0;background:var(--bg);font-family:"Cinzel","Cormorant Garamond",Georgia,serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color:white;}
    .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px;box-sizing:border-box;position:relative;}
    .stage{width:100%;max-width:var(--max-width);text-align:center;position:relative;z-index:2;}
    .player-wrap{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:28px;}
    .play-dial{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%, rgba(100,149,237,0.12), rgba(192,192,192,0.03));box-shadow:0 6px 25px rgba(100,149,237,0.06), inset 0 -6px 10px rgba(0,0,0,0.6);border:1px solid rgba(100,149,237,0.12);cursor:pointer;transition:transform .15s;}
    .play-dial:hover{transform:scale(1.05);}
    .play-dial .icon{width:56px;height:56px;display:inline-block;transform: translateX(4px);}
    .controls{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:20px;}
    .btn{background:transparent;border:1px solid rgba(100,149,237,0.18);color:var(--color-start);padding:8px 14px;cursor:pointer;border-radius:8px;font-family:inherit;font-size:16px;transition: transform .15s ease, box-shadow .15s ease;backdrop-filter: blur(4px);}
    .btn:active{transform:scale(.98);}
    .btn.primary{background:linear-gradient(180deg, rgba(100,149,237,0.06), rgba(192,192,192,0.02));border:1px solid rgba(100,149,237,0.28);color:white;}
    .lyrics{margin:0 auto;max-width:820px;padding:20px 14px;box-sizing:border-box;text-align:center;}
    .lyric-line{font-size:20px;line-height:1.6;margin:10px 0;opacity:0;transform:translateY(14px) scale(.995);transition:opacity var(--fade-time) ease, transform var(--fade-time) ease;background:linear-gradient(90deg,var(--color-start),var(--color-end));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:0 6px 20px rgba(0,0,0,0.6);}
    .lyric-line.visible{opacity:1;transform:translateY(0) scale(1);}
    @media(max-width:600px){.lyric-line{font-size:16px;}.play-dial{width:100px;height:100px;}}
