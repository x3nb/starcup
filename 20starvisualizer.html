<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hans’ Awakening</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: black;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Cinzel", serif;
  }

  /* Canvas for bubbles */
  #visualizer {
    position: absolute;
    inset: 0;
    background: transparent;
    z-index: 1;
  }

  /* Audio controls */
  .controls {
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .controls button {
    background: transparent;
    border: 1px solid cornflowerblue;
    color: cornflowerblue;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .controls button:hover {
    background: cornflowerblue;
    color: black;
  }

  .controls input[type=range] {
    accent-color: cornflowerblue;
  }

  /* Lyrics container */
  .lyrics {
    position: absolute;
    bottom: 20%;
    width: 100%;
    height: 60px;
    overflow: hidden;
    text-align: center;
    z-index: 4;
  }

  /* Individual lyric lines */
  .lyric-line {
    position: absolute;
    right: 100%;
    white-space: nowrap;
    font-size: 22px;
    letter-spacing: 1px;
    opacity: 0;
    background: linear-gradient(90deg, cornflowerblue, grey);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 8px rgba(100,149,237,0.6))
            drop-shadow(0 0 20px rgba(128,128,128,0.4));
    transition: opacity var(--fade-time, 1s) ease;
  }

  /* Animate lyric line left-to-right */
  .lyric-line.visible {
    animation: scrollLineLTR 9s linear forwards, glowTrail 3s ease-in-out infinite;
  }

  @keyframes scrollLineLTR {
    0% {
      right: 100%;
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    90% {
      opacity: 1;
    }
    100% {
      right: -100%;
      opacity: 0;
    }
  }

  @keyframes glowTrail {
    0% {
      filter: drop-shadow(0 0 8px rgba(100,149,237,0.5))
              drop-shadow(0 0 20px rgba(128,128,128,0.4));
    }
    50% {
      filter: drop-shadow(0 0 14px rgba(100,149,237,0.8))
              drop-shadow(0 0 30px rgba(128,128,128,0.6));
    }
    100% {
      filter: drop-shadow(0 0 8px rgba(100,149,237,0.5))
              drop-shadow(0 0 20px rgba(128,128,128,0.4));
    }
  }
</style>
</head>
<body>
<canvas id="visualizer"></canvas>

<audio id="audio" src="audio/lorefinal.mp3" preload="auto"></audio>

<div class="controls">
  <button id="playBtn">▶</button>
  <input id="volumeControl" type="range" min="0" max="1" step="0.01" value="0.8">
</div>

<div class="lyrics" id="lyrics">
  <div class="lyric-line">In the forgotten corners of twilight Paris...</div>
  <div class="lyric-line">Where candlelight trembles on rain-slick streets...</div>
  <div class="lyric-line">Hans remembers the darkness in his blood...</div>
  <div class="lyric-line">Until Yeshua’s light freed him from the curse...</div>
  <div class="lyric-line">The lab shattered, the angels lifted them away...</div>
  <div class="lyric-line">And the Chimera Cats Café was born from starlight.</div>
</div>

<script>
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const volumeControl = document.getElementById('volumeControl');
const canvas = document.getElementById('visualizer');
const ctx = canvas.getContext('2d');
const lines = document.querySelectorAll('.lyric-line');

let audioCtx, analyser, source, dataArray;
let started = false;
let currentLine = 0;
let lastTime = 0;

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

playBtn.addEventListener('click', () => {
  if (!started) {
    startAudio();
  } else if (audio.paused) {
    audio.play();
    playBtn.textContent = '⏸';
  } else {
    audio.pause();
    playBtn.textContent = '▶';
  }
});

volumeControl.addEventListener('input', () => {
  audio.volume = volumeControl.value;
});

function startAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);

  audio.play();
  playBtn.textContent = '⏸';
  started = true;
  requestAnimationFrame(drawVisualizer);
  requestAnimationFrame(lyricLoop);
}

function drawVisualizer() {
  if (!started) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  analyser.getByteFrequencyData(dataArray);
  const bubbleCount = 30;

  for (let i = 0; i < bubbleCount; i++) {
    const x = Math.random() * canvas.width;
    const y = canvas.height - (dataArray[i] * 2);
    const size = dataArray[i] / 10;
    const alpha = Math.min(1, dataArray[i] / 128);
    ctx.beginPath();
    ctx.arc(x, y, size, 0, 2 * Math.PI);
    ctx.fillStyle = `rgba(100,149,237,${alpha})`;
    ctx.shadowBlur = 20;
    ctx.shadowColor = 'cornflowerblue';
    ctx.fill();
  }

  requestAnimationFrame(drawVisualizer);
}

function showLine(i) {
  if (!lines[i]) return;
  const line = lines[i];
  line.classList.add('visible');

  // Pulse effect: brighten bubbles slightly when new lyric appears
  pulseBubbles();

  setTimeout(() => {
    line.classList.remove('visible');
  }, 9000);
}

function lyricLoop(timestamp) {
  if (!started) return;
  if (!lastTime) lastTime = timestamp;
  const elapsed = timestamp - lastTime;

  if (currentLine < lines.length && elapsed >= 4200) {
    showLine(currentLine++);
    lastTime = timestamp;
  }

  requestAnimationFrame(lyricLoop);
}

/* Simple synchronized pulse for bubble glow */
function pulseBubbles() {
  ctx.globalAlpha = 0.9;
  for (let i = 0; i < 20; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    const r = Math.random() * 8 + 2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(173,216,230,0.3)';
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
</script>
</body>
</html>
